name: Interoperability examples

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [custom-loop, langgraph, pydantic-ai, llamaindex, fastapi-host]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv run ruff check . ../host
      - run: uv run pyright
      - run: uv run pytest
