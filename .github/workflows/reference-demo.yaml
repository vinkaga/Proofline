# Enforces the supported Python baseline and the project's local quality gate on PRs.

name: Reference demonstration

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference-demo
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run proofline-reference-demo evaluate
      - name: Check out the pinned documentation corpus for the release suite
        run: |
          git clone https://github.com/openfga/openfga.dev.git ../openfga.dev
          git -C ../openfga.dev checkout 056865e93280715c4b1afbeae95876448218ad78
      - run: uv run proofline-reference-demo evaluate-lexical --source-root ../openfga.dev
      - run: docker compose up -d openfga
      - run: until curl --fail --silent http://localhost:8080/healthz; do sleep 1; done
      - run: uv run proofline-reference-demo evaluate-release --source-root ../openfga.dev --openfga-url http://localhost:8080
      - name: Download verified HotpotQA distractor development set
        run: |
          for url in \
            'https://huggingface.co/datasets/namlh2004/hotpotqa/resolve/7e54db4656209750ff487f6fdf8e39a66dba136b/hotpot_dev_distractor_v1.json' \
            'https://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json'; do
            if curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 \
              --output ../hotpot_dev_distractor_v1.json "$url"; then
              exit 0
            fi
          done
          exit 1
      - run: uv run proofline-reference-demo evaluate-hotpotqa
      - run: OPENFGA_URL=http://localhost:8080 uv run pytest -m integration --no-cov
      - if: always()
        run: docker compose down --volumes
