[project]
name = "scopeanchor-fastapi-host-example"
version = "0.1.1"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "scopeanchor-example-host", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pyright>=1.1.400,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.uv.sources]
scopeanchor-example-host = { path = "../host", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
