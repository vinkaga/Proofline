[project]
name = "scopeanchor-llamaindex-example"
version = "0.1.1"
requires-python = ">=3.10"
dependencies = ["llama-index-core>=0.12,<1", "scopeanchor-example-host"]

[dependency-groups]
dev = ["pyright>=1.1.400,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.uv.sources]
scopeanchor-example-host = { path = "../host", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
