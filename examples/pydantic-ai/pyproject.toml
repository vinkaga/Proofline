[project]
name = "scopeanchor-pydantic-ai-example"
version = "0.1.1"
requires-python = ">=3.10"
dependencies = ["scopeanchor-example-host", "pydantic-ai>=1,<2"]

[dependency-groups]
dev = ["pyright>=1.1.400,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.uv.sources]
scopeanchor-example-host = { path = "../host", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
