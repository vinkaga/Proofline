[project]
name = "proofline"
version = "0.1.0"
description = "Capability-attenuating retrieval for permission-preserving multi-hop RAG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vinay Agarwal" }]
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests/core"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests/core"]
addopts = ["-ra"]
