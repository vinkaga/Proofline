# Defines the initial reviewed release suite. Cases are inputs, not generated truth.

version: release-v1
lexical_quality_gate:
  # Measured against corpus-v0 with this exact reviewed suite and k=5.
  recall_at_k: 0.76
  mrr: 0.56
  ndcg_at_k: 0.60
cases:
  - id: public-check-basics
    mode: public_documentation
    principal: user:ana
    query: What does the Check API decide?
    expected: cited_answer
    required_sources: [perform-check]
  - id: public-list-objects-basics
    mode: public_documentation
    principal: user:ana
    query: What does ListObjects return?
    expected: cited_answer
    required_sources: [perform-list-objects]
  - id: public-tuple-basics
    mode: public_documentation
    principal: user:ana
    query: What is a relationship tuple?
    expected: cited_answer
    required_sources: [relationship-tuples]
  - id: public-model-basics
    mode: public_documentation
    principal: user:ana
    query: What is an authorization model?
    expected: cited_answer
    required_sources: [authorization-models]
  - id: public-paraphrase-check
    mode: public_documentation
    principal: user:ana
    query: How can an application determine whether someone may perform an action?
    expected: cited_answer
    required_sources: [perform-check]
  - id: public-paraphrase-list
    mode: public_documentation
    principal: user:ana
    query: How do I find every document a user may view?
    expected: cited_answer
    required_sources: [perform-list-objects]
  - id: public-identifier-near-miss
    mode: public_documentation
    principal: user:ana
    query: What does CheckObjects return?
    expected: abstain
    required_sources: []
  - id: public-unsupported
    mode: public_documentation
    principal: user:ana
    query: What is the default OpenFGA cache eviction interval?
    expected: abstain
    required_sources: []
  - id: tenant-acme-rollout
    mode: tenant_knowledge
    principal: user:ana
    tenant: tenant:acme
    query: What does the Acme rollout guide say about release approval?
    expected: cited_answer
    required_resources: [document:acme-rollout]
  - id: tenant-beta-denied
    mode: tenant_knowledge
    principal: user:ana
    tenant: tenant:beta
    query: What does the Beta rollout guide say about release approval?
    expected: abstain
    required_resources: []
    tags: [access_isolation]
  - id: tenant-acme-secret-denied
    mode: tenant_knowledge
    principal: user:ana
    tenant: tenant:acme
    query: Summarize Acme secret incident notes.
    expected: abstain
    required_resources: []
    tags: [access_isolation]
  - id: tenant-cross-tenant-guess
    mode: tenant_knowledge
    principal: user:ana
    tenant: tenant:acme
    query: Retrieve document:beta-rollout.
    expected: abstain
    required_resources: []
    tags: [access_isolation]
  - id: tenant-permitted-plus-public
    mode: tenant_knowledge
    principal: user:ana
    tenant: tenant:acme
    query: Compare the public rollout policy with the Acme rollout guide.
    expected: cited_answer
    required_resources: [document:acme-rollout]
  - id: permission-acme-allow
    mode: permission
    principal: user:ana
    tenant: tenant:acme
    relation: viewer
    resource: document:acme-rollout
    query: Can Ana view the Acme rollout guide?
    expected: allow
    required_tool: check_access
  - id: permission-beta-deny
    mode: permission
    principal: user:ana
    tenant: tenant:beta
    relation: viewer
    resource: document:beta-rollout
    query: Can Ana view the Beta rollout guide?
    expected: deny
    required_tool: check_access
